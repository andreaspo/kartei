<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lernkartei - Mehrstufiges Lernsystem</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // KONFIGURATION
        const MAX_STAGES = 3; // Anzahl der Stufen (anpassbar)

        // Lucide Icons als SVG-Komponenten
        const Upload = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
        );

        const RotateCcw = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="1 4 1 10 7 10"></polyline>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
        );

        const Eye = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        );

        const EyeOff = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
        );

        const Check = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        );

        const X = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        );

        function FlashcardApp() {
            const [cards, setCards] = useState([]);
            const [currentCard, setCurrentCard] = useState(null);
            const [showAnswer, setShowAnswer] = useState(false);
            const [currentStage, setCurrentStage] = useState(1);
            const [stats, setStats] = useState({});

            // Initialisiere Stats basierend auf MAX_STAGES
            useEffect(() => {
                const initialStats = {};
                for (let i = 1; i <= MAX_STAGES; i++) {
                    initialStats[`stage${i}`] = 0;
                }
                setStats(initialStats);
            }, []);

            const parseCSVLine = (line) => {
                const values = [];
                let current = '';
                let insideQuote = false;
                
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    
                    if (char === "'" && !insideQuote) {
                        insideQuote = true;
                    } else if (char === "'" && insideQuote) {
                        // Prüfe ob nächstes Zeichen auch ' ist (escaped quote)
                        if (line[i + 1] === "'") {
                            current += "'";
                            i++; // Skip next quote
                        } else {
                            insideQuote = false;
                        }
                    } else if (char === ';' && !insideQuote) {
                        values.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                // Letzten Wert hinzufügen
                values.push(current.trim());
                
                return values;
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const text = event.target.result;
                    const lines = text.split('\n').filter(line => line.trim());
                    
                    const parsedCards = lines.slice(1).map((line, index) => {
                        const values = parseCSVLine(line);
                        return {
                            id: index,
                            kategorie: values[0] || '',
                            begriff: values[1] || '',
                            definition: values[2] || '',
                            quelle: values[3] || '',
                            stage: 1
                        };
                    }).filter(card => card.begriff && card.definition);

                    setCards(parsedCards);
                    updateStats(parsedCards);
                    pickRandomCard(parsedCards);
                };
                reader.readAsText(file);
            };

            const updateStats = (cardList) => {
                const newStats = {};
                for (let i = 1; i <= MAX_STAGES; i++) {
                    newStats[`stage${i}`] = 0;
                }
                cardList.forEach(card => {
                    if (card.stage <= MAX_STAGES) {
                        newStats[`stage${card.stage}`]++;
                    }
                });
                setStats(newStats);
                
                // Aktualisiere currentStage: niedrigste Stufe mit Karten
                let newCurrentStage = MAX_STAGES + 1;
                for (let i = 1; i <= MAX_STAGES; i++) {
                    if (newStats[`stage${i}`] > 0) {
                        newCurrentStage = i;
                        break;
                    }
                }
                setCurrentStage(newCurrentStage);
            };

            const pickRandomCard = (cardList) => {
                // Wähle nur Karten aus currentStage und darunter
                const availableCards = cardList.filter(c => c.stage <= currentStage && c.stage <= MAX_STAGES);
                
                if (availableCards.length === 0) {
                    setCurrentCard(null);
                    return;
                }
                
                const randomIndex = Math.floor(Math.random() * availableCards.length);
                setCurrentCard(availableCards[randomIndex]);
                setShowAnswer(false);
            };

            const handleAnswer = (correct) => {
                if (!currentCard) return;

                const updatedCards = cards.map(card => {
                    if (card.id === currentCard.id) {
                        if (correct) {
                            // Karte steigt eine Stufe auf (max MAX_STAGES + 1 = gemeistert)
                            return {
                                ...card,
                                stage: Math.min(card.stage + 1, MAX_STAGES + 1)
                            };
                        } else {
                            // Karte fällt zurück auf Stufe 1
                            return {
                                ...card,
                                stage: 1
                            };
                        }
                    }
                    return card;
                });

                setCards(updatedCards);
                updateStats(updatedCards);
                
                // Nach Update die nächste Karte wählen
                setTimeout(() => pickRandomCard(updatedCards), 0);
            };

            const resetAll = () => {
                const resetCards = cards.map(card => ({ ...card, stage: 1 }));
                setCards(resetCards);
                updateStats(resetCards);
                pickRandomCard(resetCards);
            };

            const totalCards = cards.length;
            const completedCards = cards.filter(c => c.stage > MAX_STAGES).length;
            const progress = totalCards > 0 ? (completedCards / totalCards) * 100 : 0;

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
                    <div className="max-w-4xl mx-auto">
                        <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                            <h1 className="text-3xl font-bold text-gray-800 mb-4">Lernkartei - {MAX_STAGES}-Stufen-System</h1>
                            
                            {cards.length === 0 ? (
                                <div className="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center">
                                    <Upload size={48} className="mx-auto mb-4 text-gray-400" />
                                    <label className="cursor-pointer">
                                        <input
                                            type="file"
                                            accept=".csv"
                                            onChange={handleFileUpload}
                                            className="hidden"
                                        />
                                        <span className="bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700 inline-block">
                                            CSV-Datei hochladen
                                        </span>
                                    </label>
                                    <p className="text-gray-500 mt-4">Format: Kategorie, Begriff, Definition, Quelle</p>
                                </div>
                            ) : (
                                <>
                                    <div className="mb-6">
                                        <div className="flex justify-between items-center mb-2">
                                            <span className="text-sm font-medium text-gray-700">
                                                Fortschritt: {completedCards} / {totalCards} Karten gemeistert | Aktuelle Stufe: {currentStage <= MAX_STAGES ? currentStage : '✓'}
                                            </span>
                                            <button
                                                onClick={resetAll}
                                                className="flex items-center gap-2 text-sm text-gray-600 hover:text-gray-800"
                                            >
                                                <RotateCcw size={16} />
                                                Zurücksetzen
                                            </button>
                                        </div>
                                        <div className="w-full bg-gray-200 rounded-full h-3">
                                            <div
                                                className="bg-green-500 h-3 rounded-full transition-all duration-300"
                                                style={{ width: `${progress}%` }}
                                            />
                                        </div>
                                    </div>

                                    <div className={`grid grid-cols-${MAX_STAGES} gap-2 mb-6`}>
                                        {Array.from({ length: MAX_STAGES }, (_, i) => i + 1).map(stage => (
                                            <div key={stage} className="text-center">
                                                <div className={`${stage === currentStage ? 'bg-indigo-200 ring-2 ring-indigo-400' : 'bg-indigo-100'} rounded-lg p-3`}>
                                                    <div className="text-2xl font-bold text-indigo-600">
                                                        {stats[`stage${stage}`] || 0}
                                                    </div>
                                                    <div className="text-xs text-gray-600">Stufe {stage}</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    {currentCard ? (
                                        <div className="bg-gradient-to-br from-indigo-50 to-blue-50 rounded-lg p-6 border-2 border-indigo-200">
                                            <div className="mb-4">
                                                <span className="bg-indigo-600 text-white px-3 py-1 rounded-full text-sm">
                                                    {currentCard.kategorie}
                                                </span>
                                                <span className="ml-2 text-gray-500 text-sm">Stufe {currentCard.stage}</span>
                                            </div>
                                            
                                            <h2 className="text-2xl font-bold text-gray-800 mb-4">
                                                {currentCard.begriff}
                                            </h2>

                                            <button
                                                onClick={() => setShowAnswer(!showAnswer)}
                                                className="flex items-center gap-2 bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 mb-4"
                                            >
                                                {showAnswer ? <EyeOff size={20} /> : <Eye size={20} />}
                                                {showAnswer ? 'Antwort ausblenden' : 'Antwort anzeigen'}
                                            </button>

                                            {showAnswer && (
                                                <div className="bg-white rounded-lg p-4 mb-4 border border-gray-200">
                                                    <p className="text-gray-700 mb-2">{currentCard.definition}</p>
                                                    {currentCard.quelle && (
                                                        <p className="text-sm text-gray-500 italic">Quelle: {currentCard.quelle}</p>
                                                    )}
                                                </div>
                                            )}

                                            {showAnswer && (
                                                <div className="flex gap-4">
                                                    <button
                                                        onClick={() => handleAnswer(false)}
                                                        className="flex-1 flex items-center justify-center gap-2 bg-red-500 text-white px-6 py-3 rounded-lg hover:bg-red-600 font-medium"
                                                    >
                                                        <X size={20} />
                                                        Noch nicht gewusst
                                                    </button>
                                                    <button
                                                        onClick={() => handleAnswer(true)}
                                                        className="flex-1 flex items-center justify-center gap-2 bg-green-500 text-white px-6 py-3 rounded-lg hover:bg-green-600 font-medium"
                                                    >
                                                        <Check size={20} />
                                                        Richtig beantwortet
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        <div className="text-center py-12">
                                            <div className="text-6xl mb-4">🎉</div>
                                            <h2 className="text-2xl font-bold text-gray-800 mb-2">
                                                Glückwunsch!
                                            </h2>
                                            <p className="text-gray-600">
                                                Du hast alle Karten gemeistert!
                                            </p>
                                        </div>
                                    )}
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<FlashcardApp />, document.getElementById('root'));
    </script>
</body>
</html>
